[build]
  # Fonksiyonların nerede olduğunu belirtiyoruz (EN ÖNEMLİ KISIM BU)
  functions = "functions"
  
  # Siteyi derleme komutu
  command = "npm run build"
  
  # Yayına alınacak klasör
  publish = "public"

[[headers]]
  # Tüm dosyalar için CORS izni verelim (Garanti olsun)
  for = "/*"
    [headers.values]
    Access-Control-Allow-Origin = "*"